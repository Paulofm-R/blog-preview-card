<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="card">
      <img src="./assets/images/illustration-article.svg" alt="Illustrative image of the article."/>
      <span class="publication-type">Learning</span>
      <p>Published <time datetime="2023-12-21">21 Dec 2023</time></p>
      <h1 class="publication-title"><a href="#">HTML & CSS foundations</a></h1>
      <p class="publication-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      <div class="publisher">
        <img src="assets/images/image-avatar.webp" alt="Publisher's profile picture">
        <strong>Greg Hooper</strong>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Paulo Rodrigues</a>.
  </footer>
</body>
</html>
